# Everything on the site lives in this file.
#
# To update: edit this file, commit, and push. Vercel rebuilds in about a minute.
# Or open Claude Code in this folder and say what changed ("add the hackathon
# result to Now and make it a Work entry").
#
# If an edit breaks something (a missing field, a typo in a URL, an em dash),
# the build fails with a message naming the line to fix, and the last good
# version of the site stays live.
#
# House rules, enforced by the build:
#   - No em dashes. Use commas, colons, or a new sentence.
#   - No phone number anywhere on the site.
#   - Mosaic: no target company names, no countries tied to targets, no thesis numbers.
#   - MIV client: always "Detroit fintech startup."

